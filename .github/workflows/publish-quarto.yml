name: Render Quarto website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render and stage static site
        run: bash scripts/render-site.sh

      - name: Validate rendered website
        run: python scripts/check-site.py _site

      - name: Commit rendered website
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            index.html \
            research.html \
            teaching.html \
            search.json \
            sitemap.xml \
            robots.txt \
            site_libs \
            assets/site
          if git diff --cached --quiet; then
            echo "Rendered website is already current."
            exit 0
          fi
          git commit -m "Automated Quarto render [skip ci]"
          git push origin HEAD:master
