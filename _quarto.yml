project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

website:
  title: "Sangyoon Yi"
  site-url: "https://sangyoonstat.github.io"
  description: "Sangyoon Yi is an Assistant Professor of Statistics at Oklahoma State University working on high-dimensional inference, multi-view data integration, mediation analysis, and statistical methods for omics."
  favicon: assets/site/favicon.svg
  navbar:
    background: light
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
    right:
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=u3yAROcAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/sangyoonstat
        aria-label: GitHub
  page-footer:
    left: "© 2026 Sangyoon Yi"
  open-graph: true
  twitter-card: true
  search: false

format:
  html:
    theme: default
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: false

execute:
  freeze: auto
